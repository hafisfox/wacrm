<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#17181d" />
    <title>Salu Salon — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Roboto, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #17181d; color: #f5f5f6; }
      main { width: min(100%, 360px); text-align: center; }
      .mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px; background: #6d35db; font-size: 28px; font-weight: 800; }
      h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.02em; }
      p { margin: 0 0 24px; color: #a3a3ad; line-height: 1.55; }
      button { min-height: 48px; width: 100%; border: 0; border-radius: 12px; background: #6d35db; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>You’re offline</h1>
      <p>Salu Salon needs an internet connection to load live bookings and messages.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
